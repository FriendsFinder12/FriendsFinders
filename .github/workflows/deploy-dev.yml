name: Deploy dev

# A push to develop deploys the dev environment. Pushes that only change docs do not.
on:
  push:
    branches: [develop]
    paths:
      - src/**
      - frontend/**
      - terraform/**
      - scripts/**
      - package.json
      - package-lock.json
      - .github/workflows/deploy-*.yml
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: develop
      workspace: friendsfinders-dev
      tfvars: envs/dev.tfvars
    secrets: inherit
